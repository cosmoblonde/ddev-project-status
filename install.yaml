name: project-status

# Copied into the project's .ddev directory. Files with #ddev-generated are replaced by a later
# "ddev add-on get" and removed by "ddev add-on remove". Own checks and project-status/config are not listed,
# so updates and removal leave them alone.
project_files:
  - commands/host/project-status
  - commands/web/project-commands
  - config.project-status.yaml
  - project-status/runner
  - project-status/lib/output.sh
  - project-status/lib/i18n.sh
  - project-status/lib/git.sh
  - project-status/lang/en
  - project-status/lang/de
  - project-status/config.example
  - project-status/checks/05-git
  - project-status/checks/10-composer
  - project-status/checks/15-composer-lock
  - project-status/checks/20-npm
  - project-status/checks/30-database
  - project-status/checks/40-folders
  - project-status/checks/50-assets
  - project-status/checks/55-typo3-solr
  - project-status/checks/57-sync-size

ddev_version_constraint: '>= v1.24.10'

# post_install_actions are executed in the context of the target project's .ddev directory.
post_install_actions:
  - |
    #ddev-description:Remove the web command project-status of v1.x, it is a host command since v2.0.0
    if [ -f commands/web/project-status ] && grep -q '#ddev-generated' commands/web/project-status; then
      rm commands/web/project-status
    fi
  - |
    #ddev-description:Make commands and checks executable
    chmod +x commands/host/project-status commands/web/project-commands project-status/runner project-status/checks/*
  - |
    #ddev-description:Create project-status/config from config.example if it does not exist yet
    if [ ! -f project-status/config ]; then
      grep -v '#ddev-generated' project-status/config.example > project-status/config
      echo "project-status/config angelegt, bitte Pfade prüfen."
    fi

# removal_actions are executed in the context of the target project's .ddev directory.
removal_actions:
  - |
    #ddev-description:Keep own checks and config, remove folders that are empty now
    rmdir project-status/checks project-status/lib project-status/lang 2>/dev/null || true
    if [ -d project-status ]; then
      echo "project-status/ enthält eigene Prüfungen oder die config und bleibt stehen."
    fi
