#ddev-generated
# Runs project-status on every start. Switch off or add options in .ddev/project-status/config (HOOK, HOOK_OPTIONS).
# Hooks from config.*.yaml are added to those in config.yaml, so this does not replace project hooks.
# Runs on the host, so that the git check sees the repository; the checks themselves run in the web container.
hooks:
  post-start:
    - exec-host: ddev project-status --hook
